const SQLTXT=String.raw`-- Run this ONCE in Supabase > SQL Editor. Safe to re-run.

-- 0. Admin check helper (uses your existing public.admins table)
create or replace function public.is_admin() returns boolean
language sql security definer stable set search_path = public as
$$ select exists(select 1 from public.admins where user_id = auth.uid()) $$;

-- 1. Candidate profiles (name / email / phone of everyone who signs up)
create table if not exists public.profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  name text, email text, phone text,
  created_at timestamptz default now()
);
alter table public.profiles add column if not exists name text;
alter table public.profiles add column if not exists email text;
alter table public.profiles add column if not exists phone text;
alter table public.profiles add column if not exists created_at timestamptz default now();
alter table public.profiles enable row level security;
drop policy if exists "profiles read own or admin" on public.profiles;
create policy "profiles read own or admin" on public.profiles for select using (auth.uid() = id or public.is_admin());
drop policy if exists "profiles update own" on public.profiles;
create policy "profiles update own" on public.profiles for update using (auth.uid() = id);
drop policy if exists "profiles insert own" on public.profiles;
create policy "profiles insert own" on public.profiles for insert with check (auth.uid() = id);

-- auto-create a profile whenever someone signs up
create or replace function public.handle_new_user() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  insert into public.profiles (id, name, email, phone)
  values (new.id,
          coalesce(new.raw_user_meta_data->>'name', new.raw_user_meta_data->>'full_name'),
          new.email,
          coalesce(new.raw_user_meta_data->>'phone', new.phone))
  on conflict (id) do nothing;
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();

-- backfill people who already signed up
insert into public.profiles (id, name, email, phone, created_at)
select id, coalesce(raw_user_meta_data->>'name', raw_user_meta_data->>'full_name'), email,
       coalesce(raw_user_meta_data->>'phone', phone), created_at
from auth.users on conflict (id) do nothing;

-- 2. Saved vacancies
create table if not exists public.saved_jobs (
  user_id uuid references auth.users(id) on delete cascade,
  job_id text not null,
  job_title text,
  created_at timestamptz default now(),
  primary key (user_id, job_id)
);
alter table public.saved_jobs add column if not exists job_title text;
alter table public.saved_jobs add column if not exists created_at timestamptz default now();
alter table public.saved_jobs enable row level security;
drop policy if exists "saved own" on public.saved_jobs;
create policy "saved own" on public.saved_jobs for all using (auth.uid() = user_id) with check (auth.uid() = user_id);
drop policy if exists "saved admin read" on public.saved_jobs;
create policy "saved admin read" on public.saved_jobs for select using (public.is_admin());

-- 3. Link applications to accounts (optional but recommended)
alter table public.applications add column if not exists user_id uuid references auth.users(id) on delete set null;

-- 4. Visitor tracking
create table if not exists public.visits (
  id uuid primary key default gen_random_uuid(),
  visitor_id text not null,
  device_code text, device_name text, device_type text,
  os text, browser text, screen text, language text, timezone text,
  auth_state text not null default 'guest' check (auth_state in ('guest','signed_in','signed_up')),
  user_id uuid, name text, email text,
  source text, referrer text, utm_source text, utm_medium text, utm_campaign text,
  landing_path text,
  created_at timestamptz default now()
);
alter table public.visits add column if not exists visitor_id text;
alter table public.visits add column if not exists device_code text;
alter table public.visits add column if not exists device_name text;
alter table public.visits add column if not exists device_type text;
alter table public.visits add column if not exists os text;
alter table public.visits add column if not exists browser text;
alter table public.visits add column if not exists screen text;
alter table public.visits add column if not exists language text;
alter table public.visits add column if not exists timezone text;
alter table public.visits add column if not exists auth_state text default 'guest';
alter table public.visits add column if not exists user_id uuid;
alter table public.visits add column if not exists name text;
alter table public.visits add column if not exists email text;
alter table public.visits add column if not exists source text;
alter table public.visits add column if not exists referrer text;
alter table public.visits add column if not exists utm_source text;
alter table public.visits add column if not exists utm_medium text;
alter table public.visits add column if not exists utm_campaign text;
alter table public.visits add column if not exists landing_path text;
alter table public.visits add column if not exists created_at timestamptz default now();
create index if not exists visits_created_idx on public.visits (created_at desc);
create index if not exists visits_visitor_idx on public.visits (visitor_id);
alter table public.visits enable row level security;
drop policy if exists "visits insert anyone" on public.visits;
create policy "visits insert anyone" on public.visits for insert to anon, authenticated
  with check (char_length(visitor_id) <= 80 and char_length(coalesce(name,'')) <= 120 and char_length(coalesce(referrer,'')) <= 500);
drop policy if exists "visits admin read" on public.visits;
create policy "visits admin read" on public.visits for select using (public.is_admin());

-- remove any older loose policies, and give the roles access to the table
drop policy if exists "anyone can insert visits" on public.visits;
drop policy if exists "admin can read visits" on public.visits;
drop policy if exists "admin can delete visits" on public.visits;
grant usage on schema public to anon, authenticated;
grant insert on public.visits to anon, authenticated;
grant select on public.visits to authenticated;`;
