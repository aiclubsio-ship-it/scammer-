if(f.size>40e6){throw new Error('That video is '+Math.round(f.size/1e6)+' MB. Please compress it below 40 MB.')}
if(st)st.textContent='Uploading video, please wait...';
const old=SITE.heroVid,path='heroVid-'+Date.now()+(f.type=='video/webm'?'.webm':'.mp4');
try{await sb('/storage/v1/object/site-media/'+path,{method:'POST',auth:true,body:f,headers:{'Content-Type':f.type}});SITE.heroVid=SB.url+'/storage/v1/object/public/site-media/'+path;await persistSite();A.msg='Video saved.'}catch(x){SITE.heroVid=old;throw x}
adm()}
else if(t.dataset.a=='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);['jobs','cats','site','apps'].forEach(x=>{if(d[x]!=null)store.set(x,d[x])});location.reload()}catch(x){A.msg='That file is not a valid backup.';adm()}};r.readAsText(t.files[0])}
})().catch(x=>{A.msg='Could not save: '+x.message;adm()})});

document.addEventListener('input',e=>{const t=e.target,hp=document.getElementById('hp');if(!t.dataset||!t.dataset.hs||!hp)return;
if(t.dataset.hs=='o'){hp.style.setProperty('--o',t.value/100);const l=document.getElementById('lo');if(l)l.textContent=t.value}else hp.style.setProperty(t.dataset.hs=='x'?'--px':'--py',t.value+'%')});
/* ===== Image cropper ===== */
const CROPS={logoImg:{t:'Crop your logo',out:900,png:1,bg:1,ar:[['Original shape','o'],['3 : 1',3],['2 : 1',2],['Square',1]]},
heroImg:{t:'Crop the banner photo',out:1920,txt:1,ar:[['Wide 16:9',16/9],['Ultra wide 21:9',21/9],['Phone tall 9:16',9/16],['4 : 3',4/3],['Square',1],['Original shape','o']]},
aboutImg:{t:'Crop the About photo',out:1200,ar:[['As shown 5:3',5/3],['4 : 3',4/3],['Square',1],['Original shape','o']]}};
let CR=null;
function cropClose(){const m=document.getElementById('crop');if(m)m.remove();CR=null}
function clearBg(src){const w=src.width,h=src.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(src,0,0);const d=x.getImageData(0,0,w,h),p=d.data,E=[],st=Math.max(1,Math.floor(Math.max(w,h)/80));
for(let i=0;i<w;i+=st)E.push(i*4,((h-1)*w+i)*4);for(let j=0;j<h;j+=st)E.push(j*w*4,(j*w+w-1)*4);
let tr=0;E.forEach(o=>{if(p[o+3]<250)tr++});if(tr>E.length*.5)return src;
const med=ch=>{const q=E.map(o=>p[o+ch]).sort((m,n)=>m-n);return Math.max(1,q[q.length>>1])},B=[med(0),med(1),med(2)];
if((B[0]+B[1]+B[2])/3<150)return src;
for(let i=0;i<p.length;i+=4){let m=0;for(let ch=0;ch<3;ch++){const v=(B[ch]-p[i+ch])/B[ch];if(v>m)m=v}
let al=Math.min(1,m/.92);if(al<.06)al=0;
if(!al)p[i+3]=0;else{for(let ch=0;ch<3;ch++){const v=(p[i+ch]-B[ch]*(1-al))/al;p[i+ch]=v<0?0:v>255?255:v}p[i+3]=Math.round(al*255)}}
x.putImageData(d,0,0);return c}
async function openCrop(k,file){const cfg=CROPS[k],url=URL.createObjectURL(file);
const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('That file is not an image.'));i.src=url});
const m0=Math.min(1,2400/Math.max(im.width,im.height)),raw=document.createElement('canvas');raw.width=Math.round(im.width*m0);raw.height=Math.round(im.height*m0);raw.getContext('2d').drawImage(im,0,0,raw.width,raw.height);URL.revokeObjectURL(url);
CR={k,cfg,raw,src:raw,clear:null,ai:0,zoom:1,ox:0,oy:0,W:0,H:0,ptr:new Map()};
if(cfg.bg){CR.clear=clearBg(raw);CR.src=CR.clear}
buildCrop()}
function cropDraw(){const c=CR,cv=document.getElementById('cc');if(!c||!cv)return;const x=cv.getContext('2d'),s=c.cover*c.zoom,iw=c.src.width*s,ih=c.src.height*s;
c.ox=Math.min(0,Math.max(c.W-iw,c.ox));c.oy=Math.min(0,Math.max(c.H-ih,c.oy));
x.setTransform(c.dpr,0,0,c.dpr,0,0);x.clearRect(0,0,c.W,c.H);x.imageSmoothingQuality='high';x.drawImage(c.src,c.ox,c.oy,iw,ih)}
function cropLayout(){const c=CR,cv=document.getElementById('cc'),cs=document.getElementById('cs'),a=c.cfg.ar[c.ai][1],r=a=='o'?c.src.width/c.src.height:a;
const mw=Math.min(innerWidth-72,540),mh=Math.min(innerHeight*.44,420);let W=mw,H=W/r;if(H>mh){H=mh;W=H*r}
c.W=Math.round(W);c.H=Math.round(H);c.r=c.W/c.H;c.dpr=Math.min(devicePixelRatio||1,2);
cv.width=c.W*c.dpr;cv.height=c.H*c.dpr;cv.style.width=cs.style.width=c.W+'px';cv.style.height=cs.style.height=c.H+'px';
c.zoom=1;document.getElementById('cz').value=1;c.cover=Math.max(c.W/c.src.width,c.H/c.src.height);
c.ox=(c.W-c.src.width*c.cover)/2;c.oy=(c.H-c.src.height*c.cover)/2;cropDraw()}
function cropZoom(z){const c=CR;z=Math.min(4,Math.max(1,z));const s0=c.cover*c.zoom,s1=c.cover*z,cx=c.W/2,cy=c.H/2;c.ox=cx-(cx-c.ox)/s0*s1;c.oy=cy-(cy-c.oy)/s0*s1;c.zoom=z;document.getElementById('cz').value=z;cropDraw()}
function cropOut(){const c=CR,s=c.cover*c.zoom,sx=-c.ox/s,sy=-c.oy/s,sw=c.W/s,sh=c.H/s,base=c.r>=1?c.cfg.out:Math.round(c.cfg.out*.6),ow=Math.max(32,Math.min(base,Math.round(sw))),oh=Math.max(1,Math.round(ow/c.r)),o=document.createElement('canvas');o.width=ow;o.height=oh;const x=o.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c.src,sx,sy,sw,sh,0,0,ow,oh);return o}
async function saveImg(k,c,png){const old=SITE[k];try{if(LIVE){const bl=await new Promise(ok=>c.toBlob(ok,png?'image/png':'image/jpeg',.88)),path=k+'-'+Date.now()+(png?'.png':'.jpg');await sb('/storage/v1/object/site-media/'+path,{method:'POST',auth:true,body:bl,headers:{'Content-Type':bl.type}});SITE[k]=SB.url+'/storage/v1/object/public/site-media/'+path}else SITE[k]=c.toDataURL(png?'image/png':'image/jpeg',.88);await persistSite()}catch(x){SITE[k]=old;throw x}}
function buildCrop(){const c=CR,cfg=c.cfg,old=document.getElementById('crop');if(old)old.remove();
const d=document.createElement('div');d.id='crop';d.className='cm';
d.innerHTML=`<div class="cb"><h3>${cfg.t}</h3><p class="meta">Drag the picture to move it. Pinch, scroll or use the slider to zoom. The frame is exactly what gets saved.</p><div class="cr">${cfg.ar.map((x,i)=>`<button type="button" class="chip${i==c.ai?' on':''}" data-ai="${i}">${x[0]}</button>`).join('')}</div><div class="cs" id="cs"><canvas id="cc"></canvas>${cfg.txt?`<div class="ov" id="cov" style="background:rgba(22,19,17,${num(SITE.heroOverlay,70)/100})"><b>Your Maritime Experience.</b><span>New Opportunities Ashore.</span></div>`:''}</div><label class="zl">Zoom<input type="range" id="cz" min="1" max="4" step="0.01" value="1"></label>${cfg.bg?'<label class="ck"><input type="checkbox" id="crm" checked> Make a plain background transparent</label>':''}${cfg.txt?'<label class="ck"><input type="checkbox" id="ctx"> Preview the headline on top</label>':''}<div class="err" id="cerr"></div><div class="row"><button type="button" class="btn" id="cok">Use this crop</button><button type="button" class="btn o" id="cno">Cancel</button></div></div>`;
document.body.appendChild(d);
d.addEventListener('click',e=>{const b=e.target.closest('[data-ai]');if(b){c.ai=+b.dataset.ai;d.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==b));cropLayout()}else if(e.target==d)cropClose()});
d.querySelector('#cno').onclick=cropClose;
d.querySelector('#cz').addEventListener('input',e=>cropZoom(+e.target.value));
const rm=d.querySelector('#crm');if(rm)rm.addEventListener('change',()=>{c.src=rm.checked?c.clear:c.raw;cropLayout()});
const tx=d.querySelector('#ctx');if(tx)tx.addEventListener('change',()=>d.querySelector('#cov').classList.toggle('show',tx.checked));
const cv=d.querySelector('#cc'),pd=()=>{const p=[...c.ptr.values()];return p.length<2?0:Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1])};let ld=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);c.ptr.set(e.pointerId,[e.clientX,e.clientY]);ld=pd();cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{if(!c.ptr.has(e.pointerId))return;const p=c.ptr.get(e.pointerId);
if(c.ptr.size==1){c.ox+=e.clientX-p[0];c.oy+=e.clientY-p[1];c.ptr.set(e.pointerId,[e.clientX,e.clientY]);cropDraw()}
else{c.ptr.set(e.pointerId,[e.clientX,e.clientY]);const nd=pd();if(ld&&nd)cropZoom(c.zoom*nd/ld);ld=nd}});
const up=e=>{c.ptr.delete(e.pointerId);ld=pd();cv.style.cursor='grab'};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();cropZoom(c.zoom*(e.deltaY<0?1.08:.92))},{passive:false});
d.querySelector('#cok').onclick=async e=>{const b=e.target,er=d.querySelector('#cerr');er.textContent='';b.disabled=true;b.textContent='Saving...';
try{await saveImg(c.k,cropOut(),!!cfg.png);cropClose();A.msg='Image saved.';adm()}catch(x){b.disabled=false;b.textContent='Use this crop';er.textContent='Could not save: '+x.message}};
cropLayout()}
function closeAdmin(){sbSignOut();A.ok=false;A.step='email';A.msg='';adm()}
function hashLogin(){const h=new URLSearchParams(location.hash.slice(1));if(h.get('access_token')){try{sessionStorage.setItem('sbs',JSON.stringify({access:h.get('access_token'),refresh:h.get('refresh_token'),exp:+h.get('expires_at')||Math.floor(Date.now()/1000)+(+h.get('expires_in')||3600)}))}catch(e){}history.replaceState(null,'',location.pathname)}}
async function startAdmin(){hashLogin();try{await loadLive()}catch(x){A.msg='Could not load data: '+x.message}
if(SES()){try{const ad=await sb('/rest/v1/admins?select=user_id',{auth:true});if(!ad.length)throw new Error('This account is not an admin.');await adminLoad();A.ok=true}catch(x){sbSignOut();A.msg=x.message}}adm()}
startAdmin();
</script></body></html>
